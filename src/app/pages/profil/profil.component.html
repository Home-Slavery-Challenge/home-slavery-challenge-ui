
<div class="main-container">
  <div class="content-container">
    <div class="content-area" cds-layout="m-t:md">
      <router-outlet/>
    </div>
    <clr-vertical-nav>
      @for (s of sectionArray; track s.path) {
        <a
          clrVerticalNavLink
          [routerLink]="s.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          {{ s.title }}
        </a>
      }
    </clr-vertical-nav>
  </div>
</div>
