@if (users$ | async; as users) {
  @if (users.length > 0) {

    <clr-datagrid>
      <clr-dg-column>Name</clr-dg-column>
      <clr-dg-row *clrDgItems="let user of ((users$ | async) ?? [])" [clrDgItem]="user">
        <clr-dg-cell>{{ user.username | titlecase}}</clr-dg-cell>
        <clr-dg-action-overflow>
          <button class="action-item" (click)="decline(user.id)">Decline</button>
          <button class="action-item" (click)="block(user.id)">Block</button>
        </clr-dg-action-overflow>

      </clr-dg-row>
      <!--      <clr-dg-footer>{{ friendshipService.users.length}} users</clr-dg-footer>-->
    </clr-datagrid>

  } @else {
    <p style="text-align: center">No friends for the moment</p>
  }
} @else {
  <p>Loading...</p>
}
<app-alert
  [alert]="messageAlert.alert"
  [type]="messageAlert.type"
  [message]="messageAlert.message">
</app-alert>
<div style="margin-top: 25px">
<app-find-friends />
<app-pending-friends />
<app-blocked-friends />
</div>
