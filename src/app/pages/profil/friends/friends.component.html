@if (users$ | async; as users) {
  @if (users.length > 0) {

    <clr-datagrid>
      <clr-dg-column>Name</clr-dg-column>
      <clr-dg-row *clrDgItems="let user of ((users$ | async) ?? [])" [clrDgItem]="user">
        <clr-dg-cell>{{ user.username }}
          <a (click)="decline(user.id)" >
            x
          </a>
          <a (click)="block(user.id)" >
            <cds-icon shape="ban"></cds-icon>
          </a>
        </clr-dg-cell>
        <clr-dg-cell>
          <span class="color-square"></span>
        </clr-dg-cell>
      </clr-dg-row>
      <!--      <clr-dg-footer>{{ friendshipService.users.length}} users</clr-dg-footer>-->
    </clr-datagrid>

  } @else {
    <p>No friends for the moment</p>
  }
} @else {
  <p>Loading...</p>
}
<app-alert
  [alert]="messageAlert.alert"
  [type]="messageAlert.type"
  [message]="messageAlert.message">
</app-alert>
<app-find-friends />
<app-pending-friends />
<app-blocked-friends />
