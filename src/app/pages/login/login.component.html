
<div class="login-wrapper">
  <form class="login" [formGroup]="loginForm" (ngSubmit)="handleLogin()">
    <div class="login-body">
      <section class="title">
        <div class="welcome">Login</div>
      </section>
      <div class="login-group">
        <clr-input-container>
          <label class="clr-sr-only">Username</label>
          <input
            type="text"
            autocomplete="username"
            name="username"
            clrInput
            placeholder="Enter username"
            formControlName="username"
          />
        </clr-input-container>
        <clr-password-container>
          <label class="clr-sr-only">Password</label>
          <input
            type="password"
            autocomplete="current-password"
            name="password"
            clrPassword
            placeholder="Enter password"
            formControlName="password"
          />
        </clr-password-container>

        @if (errorMessage !=="") {
          <div class="alert alert-danger">
            {{ errorMessage }}
          </div>
        }

<!--        <clr-checkbox-wrapper>-->
<!--          <label>Remember me</label>-->
<!--          <input type="checkbox" name="rememberMe" clrCheckbox [(ngModel)]="form.rememberMe" />-->
<!--        </clr-checkbox-wrapper>-->
<!--        <div class="error active">Invalid user name or password</div>-->
        <button type="submit" class="btn btn-primary">Log in</button>
        <a href="/register" class="signup">Sign up for an account</a>
      </div>
    </div>
  </form>
</div>
