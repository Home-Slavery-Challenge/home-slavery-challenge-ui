<button type="button" class="btn btn-primary" (click)="findModal = true">Find</button>
<clr-modal [(clrModalOpen)]="findModal">
  <h3 class="modal-title">Search friends</h3>
  <div class="modal-body">

    <form clrForm>
      <clr-input-container>
        <input clrInput placeholder="Friend" name="username" (keyup)="updateSearchField()" [(ngModel)]="inputSearch" />
        <div clrInputPrefix><cds-icon shape="search"/></div>
      </clr-input-container>
    </form>

    <clr-datagrid>
      <clr-dg-column>Name</clr-dg-column>
      <clr-dg-row *clrDgItems="let user of users" [clrDgItem]="user">
        <clr-dg-cell>{{ user.username }}
          <a>
            <cds-icon shape="plus"></cds-icon>
          </a>
          <a>
            <cds-icon shape="ban"></cds-icon>
          </a>
        </clr-dg-cell>
        <clr-dg-cell>
          <span class="color-square"></span>
        </clr-dg-cell>
      </clr-dg-row>
      <clr-dg-footer>{{ users.length }} users</clr-dg-footer>
    </clr-datagrid>

  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="findModal = false">Close</button>
  </div>
</clr-modal>
