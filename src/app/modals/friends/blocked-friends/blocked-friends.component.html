<button type="button" class="btn btn-primary" (click)="openModal()" >Blocked</button>
<clr-modal [(clrModalOpen)]="findModal">
  <h3 class="modal-title">Blocked Friendship</h3>
  <div class="modal-body">
    <clr-datagrid>
      <clr-dg-column>Name</clr-dg-column>
      <clr-dg-row *clrDgItems="let user of ((users$ | async) ?? [])" [clrDgItem]="user">
        <clr-dg-cell>{{ user.username | titlecase }}
        </clr-dg-cell>
        <clr-dg-action-overflow>
          <button class="action-item" (click)="unblock(user.id)">Unblock</button>
        </clr-dg-action-overflow>
      </clr-dg-row>
<!--      <clr-dg-footer>{{ users.length }} users</clr-dg-footer>-->
    </clr-datagrid>
    <app-alert
      [alert]="messageAlert.alert"
      [type]="messageAlert.type"
      [message]="messageAlert.message">
    </app-alert>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="findModal = false">Close</button>
  </div>
</clr-modal>
